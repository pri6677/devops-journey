<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Personal File Server</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <section class="card">

            <h1>Personal File Server</h1>

            <h2>Login</h2>


            {% if error %}

            <p class="error">
                {{ error }}
            </p>

            {% endif %}


            <form action="/login" method="post">

                <p>

                    <label>
                        Username
                    </label>

                    <br>

                    <input
                        type="text"
                        name="username"
                        required
                    >

                </p>


                <p>

                    <label>
                        Password
                    </label>

                    <br>

                    <input
                        type="password"
                        name="password"
                        required
                    >

                </p>


                <button type="submit">
                    Login
                </button>

            </form>

        </section>

    </div>

</body>

</html>
